<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환율 대시보드 + ML</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
        header { background: #1a73e8; color: white; padding: 20px 40px; }
        header h1 { font-size: 1.5rem; }
        header p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card .currency { font-size: 0.85rem; color: #888; margin-bottom: 6px; }
        .card .rate { font-size: 1.6rem; font-weight: 700; }
        .card .change { font-size: 0.9rem; margin-top: 4px; }
        .up { color: #e53935; }
        .down { color: #1e88e5; }
        .section { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 30px; }
        .section h2 { font-size: 1rem; margin-bottom: 12px; color: #555; }
        .select-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        select, button { padding: 8px 16px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.9rem; cursor: pointer; }
        button { background: #1a73e8; color: white; border: none; }
        button:hover { background: #1558b0; }
        button.purple { background: #7e57c2; }
        button.purple:hover { background: #5e35b1; }
        button.orange { background: #fb8c00; }
        button.orange:hover { background: #ef6c00; }
        .collect-btn { display: block; margin: 0 auto 30px; padding: 12px 32px; font-size: 1rem; }
        #status { text-align: center; margin-bottom: 16px; color: #555; font-size: 0.9rem; }

        /* ML 섹션 */
        .ml-banner { background: #f5f0ff; border-left: 4px solid #7e57c2; padding: 10px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.85rem; color: #444; }
        .ml-result { background: #f9f9f9; border-radius: 8px; padding: 16px; margin-top: 12px; }
        .ml-result.normal { border-left: 4px solid #43a047; }
        .ml-result.anomaly { border-left: 4px solid #e53935; }
        .ml-result.empty { color: #999; text-align: center; }
        .ml-result .label { font-size: 0.8rem; color: #888; }
        .ml-result .value { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }
        .ml-result .meta { font-size: 0.75rem; color: #777; margin-top: 8px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; margin-left: 6px; }
        .badge.green { background: #e8f5e9; color: #2e7d32; }
        .badge.red { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
<header>
    <h1>📈 실시간 환율 대시보드 + ML</h1>
    <p>USD 기준 주요 통화 환율 모니터링 + KRW 예측 및 이상치 탐지</p>
</header>
<div class="container">
    <p id="status">데이터를 불러오는 중...</p>
    <button class="collect-btn" onclick="collectData()">🔄 최신 환율 수집</button>

    <!-- 환율 카드 -->
    <div class="card-grid" id="cards"></div>

    <!-- 차트 -->
    <div class="section">
        <h2>📊 환율 이력 차트</h2>
        <div class="select-row">
            <select id="currencySelect">
                <option value="KRW">KRW (원)</option>
                <option value="EUR">EUR (유로)</option>
                <option value="JPY">JPY (엔)</option>
                <option value="CNY">CNY (위안)</option>
                <option value="GBP">GBP (파운드)</option>
            </select>
            <button onclick="loadChart()">조회</button>
        </div>
        <canvas id="rateChart" height="100"></canvas>
    </div>

    <!-- 예측 섹션 -->
    <div class="section">
        <h2>🔮 KRW 환율 예측 (ML)</h2>
        <div id="predictorBanner" class="ml-banner">예측 모델 정보를 불러오는 중...</div>
        <button class="purple" onclick="runPrediction()">📈 다음날 KRW 환율 예측하기</button>
        <div id="predictResult" class="ml-result empty">아직 예측을 실행하지 않았습니다.</div>
    </div>

    <!-- 이상치 탐지 섹션 -->
    <div class="section">
        <h2>🚨 환율 이상치 탐지 (ML)</h2>
        <div id="detectorBanner" class="ml-banner">탐지 모델 정보를 불러오는 중...</div>
        <button class="orange" onclick="runAnomalyCheck()">🔍 최근 환율 이상치 확인</button>
        <div id="anomalyResult" class="ml-result empty">아직 탐지를 실행하지 않았습니다.</div>
    </div>
</div>

<script>
    let chart = null;

    // ========================================
    // 기존 환율 기능 (중간과제부터 유지)
    // ========================================
    async function loadLatest() {
        try {
            const res = await fetch('/rates/latest');
            if (!res.ok) {
                document.getElementById('status').textContent = '⚠️ 데이터 없음. 위 버튼으로 수집하세요.';
                return;
            }
            const data = await res.json();
            document.getElementById('status').textContent =
                `✅ 마지막 업데이트: ${new Date(data[0].collected_at + 'Z').toLocaleString('ko-KR')}`;
            const cards = document.getElementById('cards');
            cards.innerHTML = '';
            data.forEach(item => {
                const sign = item.change_percent >= 0 ? '+' : '';
                const cls = item.change_percent >= 0 ? 'up' : 'down';
                cards.innerHTML += `
                    <div class="card">
                        <div class="currency">USD → ${item.currency}</div>
                        <div class="rate">${item.rate.toLocaleString()}</div>
                        <div class="change ${cls}">${sign}${item.change_percent.toFixed(4)}%</div>
                    </div>`;
            });
        } catch (e) {
            document.getElementById('status').textContent = '❌ 서버 연결 실패';
        }
    }

    async function collectData() {
        document.getElementById('status').textContent = '수집 중...';
        await fetch('/rates/collect', { method: 'POST' });
        await loadLatest();
        await loadChart();
    }

    async function loadChart() {
        const currency = document.getElementById('currencySelect').value;
        const res = await fetch(`/rates/history/${currency}?limit=30`);
        if (!res.ok) return;
        const data = await res.json();
        const reversed = data.reverse();
        const labels = reversed.map(d => new Date(d.collected_at + 'Z').toLocaleDateString('ko-KR'));
        const rates = reversed.map(d => d.rate);

        if (chart) chart.destroy();
        const ctx = document.getElementById('rateChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: `USD → ${currency}`,
                    data: rates,
                    borderColor: '#1a73e8',
                    backgroundColor: 'rgba(26,115,232,0.1)',
                    tension: 0.3,
                    fill: true,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { position: 'top' } },
                scales: { y: { beginAtZero: false } }
            }
        });
    }

    // ========================================
    // ML 기능 (기말과제 추가)
    // ========================================
    async function loadModelInfo() {
        try {
            const res = await fetch('/ml/model-info');
            const info = await res.json();

            // Predictor
            const pBanner = document.getElementById('predictorBanner');
            if (info.predictor && info.predictor.version) {
                pBanner.innerHTML = `현재 운영 모델: <b>${info.predictor.model_name}</b> 
                    <span class="badge green">${info.predictor.version}</span>
                    (학습일: ${info.predictor.trained_at || '-'})`;
            } else {
                pBanner.textContent = '⚠️ 예측 모델이 학습되지 않았습니다.';
            }

            // Detector
            const dBanner = document.getElementById('detectorBanner');
            if (info.detector && info.detector.version) {
                dBanner.innerHTML = `현재 운영 모델: <b>${info.detector.model_name}</b> 
                    <span class="badge green">${info.detector.version}</span>
                    (학습일: ${info.detector.trained_at || '-'})`;
            } else {
                dBanner.textContent = '⚠️ 탐지 모델이 학습되지 않았습니다.';
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function runPrediction() {
        const box = document.getElementById('predictResult');
        box.className = 'ml-result empty';
        box.textContent = '예측 중...';
        try {
            const res = await fetch('/predict/krw', { method: 'POST' });
            const data = await res.json();
            if (!res.ok) {
                box.className = 'ml-result anomaly';
                box.innerHTML = `<div class="label">에러</div>
                    <div class="value" style="font-size:1rem;">${data.detail || '알 수 없는 오류'}</div>`;
                return;
            }
            box.className = 'ml-result normal';
            const predictedFor = new Date(data.predicted_for + 'Z').toLocaleString('ko-KR');
            box.innerHTML = `
                <div class="label">예측된 USD → KRW (다음날)</div>
                <div class="value">${data.predicted_rate.toLocaleString()} 원</div>
                <div class="meta">
                    예측 대상 시점: ${predictedFor}<br>
                    모델: <b>${data.model_name}</b> / 버전: <b>${data.model_version}</b>
                </div>
            `;
        } catch (e) {
            box.className = 'ml-result anomaly';
            box.textContent = '❌ 서버 연결 실패';
        }
    }

    async function runAnomalyCheck() {
        const box = document.getElementById('anomalyResult');
        box.className = 'ml-result empty';
        box.textContent = '탐지 중...';
        try {
            const res = await fetch('/anomaly/check', { method: 'POST' });
            const data = await res.json();
            if (!res.ok) {
                box.className = 'ml-result anomaly';
                box.innerHTML = `<div class="label">에러</div>
                    <div class="value" style="font-size:1rem;">${data.detail || '알 수 없는 오류'}</div>`;
                return;
            }
            const cls = data.is_anomaly ? 'anomaly' : 'normal';
            const badge = data.is_anomaly
                ? '<span class="badge red">이상치 ⚠️</span>'
                : '<span class="badge green">정상 ✓</span>';
            box.className = `ml-result ${cls}`;
            box.innerHTML = `
                <div class="label">최근 KRW 환율 분석 결과 ${badge}</div>
                <div class="value">${data.rate.toLocaleString()} 원 
                    <span style="font-size:0.9rem; color:#888;">(${data.change_percent}%)</span>
                </div>
                <div class="meta">
                    이상치 점수: <b>${data.anomaly_score}</b> (낮을수록 이상)<br>
                    모델 버전: <b>${data.model_version}</b> / 
                    탐지 시각: ${new Date(data.detected_at + 'Z').toLocaleString('ko-KR')}
                </div>
            `;
        } catch (e) {
            box.className = 'ml-result anomaly';
            box.textContent = '❌ 서버 연결 실패';
        }
    }

    // 초기 로드
    loadLatest();
    loadChart();
    loadModelInfo();
</script>
</body>
</html>
